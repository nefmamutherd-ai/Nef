<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Prueba · plato sobre la carta</title>
<!-- Prueba de realidad aumentada sin apps: MindAR reconoce la carta impresa y el plato queda parado sobre ella -->
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  /* Sin fondo en body: la cámara (video de MindAR, z-index negativo) va detrás del body y un fondo la tapaba */
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
  html { background: #000; }
  body { background: transparent; }
  #aviso { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 10;
    max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 18px; background: rgba(0,0,0,.6); color: #fff;
    font-weight: 600; font-size: 15px; text-align: center; pointer-events: none; }
</style>
</head>
<body>
<div id="aviso">Apunta la cámara a la carta</div>
<a-scene mindar-image="imageTargetSrc: /prueba-ar/carta.mind; filterMinCF: 0.0001; filterBeta: 0.001; uiScanning: no; uiLoading: no"
  color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true"
  vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-assets><a-asset-item id="plato" src="/assets/demo/3d/capuchino.glb"></a-asset-item></a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-light type="hemisphere" color="#fff" ground-color="#8a6a50" intensity="1.6"></a-light>
  <a-light type="directional" position="0.5 1 1" intensity="1.4"></a-light>
  <!-- 1 unidad = ancho de la carta (~6,3 cm). El .glb viene en metros: 16 sería tamaño real (plato de 19 cm = 3 cartas); 10 para la prueba.
       Girado 90° para que el plato quede de pie sobre la carta (no pegado a ella como una foto). -->
  <a-entity id="ancla" mindar-image-target="targetIndex: 0">
    <a-gltf-model src="#plato" rotation="90 0 0" position="0 0 0" scale="10 10 10"></a-gltf-model>
  </a-entity>
</a-scene>
<script>
  const aviso = document.getElementById('aviso');
  const ancla = document.getElementById('ancla');
  ancla.addEventListener('targetFound', () => { aviso.textContent = 'Muévete alrededor: el plato se queda en la carta'; });
  ancla.addEventListener('targetLost', () => { aviso.textContent = 'Apunta la cámara a la carta'; });
  // MindAR no se reacomoda si el celular gira (queda fondo negro): al cambiar de vertical a horizontal, vuelve a arrancar
  let vertical = innerHeight > innerWidth;
  const reacomodar = () => { const v = innerHeight > innerWidth; if (v !== vertical) location.reload(); };
  addEventListener('resize', () => setTimeout(reacomodar, 300));
  if (screen.orientation) screen.orientation.addEventListener('change', () => setTimeout(reacomodar, 300));
  document.querySelector('a-scene').addEventListener('arError', () => { aviso.textContent = 'Permite el uso de la cámara y recarga'; });
</script>
</body>
</html>
