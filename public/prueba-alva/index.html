<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Prueba · plato que se queda en la mesa</title>
<!-- PRUEBA de seguimiento del mundo sin apps: AlvaAR (SLAM en el navegador, GPL-3, ver lib/LICENSE-AlvaAR-GPL3).
     La cámara calcula cómo se mueve el celular; el plato se pone una vez y se queda en su sitio aunque mires a otro lado.
     Una sola cámara no mide distancias reales: el tamaño es aproximado. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
  #escena { position: fixed; inset: 0; }
  #escena canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #aviso { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 10;
    width: max-content; max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 18px; background: rgba(0,0,0,.6); color: #fff;
    font-weight: 600; font-size: 15px; line-height: 1.3; text-align: center; pointer-events: none; }
  .boton { position: fixed; left: 50%; transform: translateX(-50%); z-index: 10; min-height: 52px; padding: 0 28px; border: 0;
    border-radius: 999px; background: #fff; color: #1F1B17; font: 700 17px system-ui, sans-serif; cursor: pointer; }
  #empezar { top: 50%; }
  #recolocar { bottom: calc(24px + env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<div id="escena"></div>
<p id="aviso">Siéntate frente a tu mesa y toca Empezar</p>
<button class="boton" id="empezar" type="button">Empezar</button>
<button class="boton" id="recolocar" type="button" hidden>Poner el plato aquí</button>
<script type="module">
import * as THREE from './lib/three/three.module.min.js';
import { GLTFLoader } from './lib/three/jsm/loaders/GLTFLoader.js';
import { RoomEnvironment } from './lib/three/jsm/environments/RoomEnvironment.js';
import { AlvaAR } from './lib/alva_ar.js';
import { AlvaARConnectorTHREE } from './lib/alva_ar_three.js';
import { Camera, onFrame, resize2cover } from './lib/utils.js';

const $ = (id) => document.getElementById(id);
const aviso = (t) => { $('aviso').textContent = t; };
const DISTANCIA = 10;   // unidades del mapa (sin escala real) a las que se pone el plato
const ESCALA = 13;      // el .glb viene en metros; ~1/3 del ancho de la pantalla al ponerlo

$('empezar').addEventListener('click', async () => {
  $('empezar').hidden = true;
  aviso('Abriendo la cámara…');
  let media;
  try {
    media = await Camera.Initialize({ video: { facingMode: 'environment', aspectRatio: 16 / 9, width: { ideal: 1280 } }, audio: false });
  } catch {
    aviso('Permite el uso de la cámara y recarga la página');
    return;
  }
  const video = media.el;
  const caja = $('escena');
  const ancho = caja.clientWidth, alto = caja.clientHeight;
  const tam = resize2cover(video.videoWidth, video.videoHeight, ancho, alto);

  // Lienzo 2D: muestra la cámara y le pasa cada cuadro a AlvaAR
  const lienzo = document.createElement('canvas');
  lienzo.width = ancho; lienzo.height = alto;
  const ctx = lienzo.getContext('2d', { alpha: false, desynchronized: true, willReadFrequently: true });
  caja.append(lienzo);
  aviso('Preparando…');
  const alva = await AlvaAR.Initialize(ancho, alto);

  // Mundo 3D transparente encima
  const render = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  render.setClearColor(0, 0);
  render.setSize(ancho, alto, false);
  render.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  render.toneMapping = THREE.ACESFilmicToneMapping;
  render.outputColorSpace = THREE.SRGBColorSpace;
  caja.append(render.domElement);
  const escena = new THREE.Scene();
  escena.environment = new THREE.PMREMGenerator(render).fromScene(new RoomEnvironment(), 0.04).texture;
  escena.add(new THREE.HemisphereLight(0xffffff, 0x8a6a50, 1.2));
  const camara = new THREE.PerspectiveCamera(75, ancho / alto, 0.1, 1000);
  camara.rotation.reorder('YXZ');
  escena.add(camara);
  const aplicarPose = AlvaARConnectorTHREE.Initialize(THREE);

  const plato = new THREE.Group();
  plato.visible = false;
  escena.add(plato);
  try {
    const gltf = await new GLTFLoader().loadAsync('/assets/demo/3d/capuchino.glb');
    const m = gltf.scene;
    const b = new THREE.Box3().setFromObject(m);
    const c = b.getCenter(new THREE.Vector3());
    m.position.set(-c.x, -b.min.y, -c.z);
    plato.add(m);
    plato.scale.setScalar(ESCALA);
  } catch {
    aviso('No se pudo cargar el plato. Revisa tu internet.');
    return;
  }

  // Poner el plato frente a la cámara, apoyado en la mesa: su "arriba" mira hacia el celular
  // (por eso hay que apuntar a la mesa desde arriba, un poco inclinado, al ponerlo)
  let puesto = false;
  const poner = () => {
    const adelante = new THREE.Vector3(0, 0, -1).applyQuaternion(camara.quaternion);
    plato.position.copy(camara.position).addScaledVector(adelante, DISTANCIA);
    plato.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), adelante.clone().negate());
    plato.visible = true;
    puesto = true;
    aviso('Mira a otro lado y vuelve: el plato debería seguir ahí');
  };
  $('recolocar').addEventListener('click', () => { puesto = false; plato.visible = false; poner(); });

  aviso('Apunta a la mesa y mueve el celular despacio de lado a lado');
  let perdido = 0;
  onFrame(() => {
    if (document.hidden) return true;
    ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight, tam.x, tam.y, tam.width, tam.height);
    const pose = alva.findCameraPose(ctx.getImageData(0, 0, ancho, alto));
    if (pose) {
      aplicarPose(pose, camara.quaternion, camara.position);
      perdido = 0;
      $('recolocar').hidden = false;
      if (!puesto) poner();
      else plato.visible = true;
    } else {
      // Puntos blancos: lo que la cámara está tratando de reconocer
      ctx.fillStyle = '#fff';
      for (const p of alva.getFramePoints()) ctx.fillRect(p.x, p.y, 2, 2);
      if (++perdido > 15) {
        plato.visible = false;
        aviso(puesto ? 'Perdí la mesa: vuelve a apuntar donde estaba el plato' : 'Apunta a la mesa y mueve el celular despacio de lado a lado');
      }
    }
    render.render(escena, camara);
    return true;
  }, 30);
});
</script>
</body>
</html>
